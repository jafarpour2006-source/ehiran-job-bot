name: رصد آگهی‌های استخدام بهداشت محیط

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: نصب وابستگی‌ها
        run: pip install -r requirements.txt

      - name: بازیابی بانک اطلاعاتی آگهی‌ها
        uses: actions/cache@v4
        with:
          path: jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: اجرای ربات
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "@behdashtmohitiran"
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python run_once.py
